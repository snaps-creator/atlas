[package]
name = "atlas-setup-host"
version = "3.3.1"
edition = "2021"
[[bin]]
name = "AtlasSetupHost"
path = "../../src-tauri/src/updater_main.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
ipnet = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "io-util", "macros"] }
minisign-verify = "=0.2.5"
ring = "0.17"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows_api = { package = "windows", version = "=0.62.2", features = ["Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Services", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Rpc", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi"] }
