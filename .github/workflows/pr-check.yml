name: Check pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
      # Integration tests spawn real Mihomo/Xray processes. Serialize them so
      # unrelated tests cannot starve a core's controller startup on Windows.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t

      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci

      - name: Test frontend
        run: npm test

      - name: Test updater signature verification
        run: node --test scripts/*.check.cjs

      - name: Verify offline source-archive installer
        shell: pwsh
        run: |
          node scripts/verify-offline-installer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline installer signature failed.' }
          ./scripts/test-offline-installer.ps1

      - name: Verify checked-in installer when present
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $label = if ($version -match '^(\d+\.\d+\.\d+)-alpha(?:\..*)?$') { "Alpha $($Matches[1])" } elseif ($version -match '^1\.0\.0-beta\.(\d+(?:\.\d+)*)$') { "Beta $($Matches[1])" } else { $version }
          $installer = "Atlas $label Setup.exe"
          if (Test-Path -LiteralPath $installer) {
            node scripts/verify-installer.cjs $installer
            if ($LASTEXITCODE -ne 0) { throw 'Checked-in installer signature is invalid.' }
          }

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --bin AtlasMaintenance --bin AtlasUpdater

      - name: Verify actual restricted desktop process
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin AtlasUpdater -- --exact update_user::tests::restricted_process_runs_without_admin --ignored

      - name: Check production build
        run: npm run build
