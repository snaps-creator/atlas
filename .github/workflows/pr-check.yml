name: Check pull request
on:
  pull_request: null
  workflow_call: {}
permissions:
  contents: read
jobs:
  release-readiness:
    uses: ./.github/workflows/updater-readiness.yml
  test:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t
      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Test frontend
        run: npm test
      - name: Test updater signature verification
        run: node --test scripts/*.check.cjs
      - name: Verify release distribution contracts
        run: node --test scripts/release-distribution.check.cjs
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --bin atlas-vpn --bin AtlasMaintenance --bin AtlasUpdater
      - name: Verify actual restricted desktop process
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin AtlasUpdater -- --exact update_user::tests::restricted_process_runs_without_admin --ignored
      - name: Verify actual native tray input and callback
        run: ./scripts/test-tray-protocol.ps1
      - name: Check production build
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-tray-evidence
          path: temp/tray-protocol-*/**
          retention-days: 7
