name: Check pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test updater signature verification
        run: node --test scripts/verify-installer.check.cjs

      - name: Verify checked-in installer when present
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $label = if ($version -match '^(\d+\.\d+\.\d+)-alpha(?:\..*)?$') { "Alpha $($Matches[1])" } elseif ($version -match '^1\.0\.0-beta\.(\d+(?:\.\d+)*)$') { "Beta $($Matches[1])" } else { $version }
          $installer = "Atlas $label Setup.exe"
          if (Test-Path -LiteralPath $installer) {
            node scripts/verify-installer.cjs $installer
            if ($LASTEXITCODE -ne 0) { throw 'Checked-in installer signature is invalid.' }
          }

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check production build
        run: npm run build
