name: Publish Atlas update

on:
  push:
    branches:
      - main

concurrency:
  group: atlas-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v6

      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t

      - name: Install dependencies
        run: npm ci

      - name: Stamp unique release build (keep Alpha display label)
        run: |
          node --test scripts/stamp-release-version.check.cjs
          node scripts/stamp-release-version.cjs

      - name: Test frontend
        run: npm test

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check whether the version is already released
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether tag v$version already exists."
          }
          if ($existingTag) {
            "released=true" >> $env:GITHUB_OUTPUT
            Write-Host "Version $version is already published; no duplicate Release is needed."
          } else {
            "released=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build and publish signed update
        if: steps.release-version.outputs.released != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Atlas __VERSION__
          releaseBody: Автоматическое обновление Atlas. Подробности изменений — в связанных pull requests.
          releaseDraft: false
          # This is the application's update channel: /releases/latest must resolve it.
          # The displayed product version remains Alpha; each build has a unique semver.
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
