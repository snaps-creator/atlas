name: Isolated installed desktop proof
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  desktop-proof:
    if: github.ref == 'refs/heads/audit/tray-root-cause' && inputs.confirmation == 'Diagnostic only - do not publish'
    uses: ./.github/workflows/updater-readiness.yml
    secrets: inherit
