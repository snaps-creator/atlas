name: Publish Atlas update

on:
  push:
    branches:
      - main

concurrency:
  group: atlas-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      ATLAS_BUILD_ID: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
      # Integration tests spawn multiple real Mihomo/Xray processes. Serial
      # execution avoids controller startup timeouts on busy Windows runners.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t

      - name: Install dependencies
        run: npm ci

      - name: Stamp unique release build (keep Alpha display label)
        run: |
          node --test scripts/stamp-release-version.check.cjs
          node scripts/stamp-release-version.cjs

      - name: Test frontend
        run: npm test

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check whether the version is already released
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether tag v$version already exists."
          }
          if ($existingTag) {
            "released=true" >> $env:GITHUB_OUTPUT
            Write-Host "Version $version is already published; no duplicate Release is needed."
          } else {
            "released=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build, verify interface and publish signed update
        if: steps.release-version.outputs.released != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/publish-verified-update.ps1 -Installer ("t/release/bundle/nsis/Atlas_" + $version + "_x64-setup.exe")
