name: Publish Atlas update

on:
  push:
    branches:
      - main

concurrency:
  group: atlas-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      ATLAS_BUILD_ID: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
      CARGO_INCREMENTAL: '0'
      # Integration tests spawn multiple real Mihomo/Xray processes. Serial
      # execution avoids controller startup timeouts on busy Windows runners.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Verify repeatable MSVC initialization
        shell: pwsh
        run: ./scripts/test-msvc-initialization.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Verify stable release version
        run: |
          node --test scripts/stamp-release-version.check.cjs
          node scripts/stamp-release-version.cjs

      - name: Test frontend
        run: npm test

      - name: Test updater verification contracts
        run: node --test scripts/verify-update-contract.check.cjs scripts/updater-safety.check.cjs scripts/verify-package-content.check.cjs scripts/create-update-manifest.check.cjs

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --bin AtlasMaintenance --bin AtlasUpdater

      - name: Check whether the version is already released
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether tag v$version already exists."
          }
          if ($existingTag) {
            "released=true" >> $env:GITHUB_OUTPUT
            Write-Host "Version $version is already published; no duplicate Release is needed."
          } else {
            "released=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build, verify interface and publish signed update
        if: steps.release-version.outputs.released != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/build-release-installer.ps1 -Clean -Signed -TargetDirectory t/release-clean -OutputDirectory artifacts/release
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = "artifacts/release/Atlas_${version}_x64-setup.exe"
          ./scripts/test-connected-upgrade.ps1 -Installer $installer
          ./scripts/publish-verified-update.ps1 -Installer $installer
      - name: Preserve generated installer and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-update-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/



          if-no-files-found: warn
