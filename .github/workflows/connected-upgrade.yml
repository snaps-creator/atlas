name: Verify connected upgrade
on:
  pull_request:
permissions:
  contents: read
jobs:
  build-installer:
    uses: ./.github/workflows/pr-installer.yml
    secrets: inherit
  connected-upgrade:
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-Windows-x64-PR-${{ github.event.pull_request.number }}
          path: candidate-installer
      - name: Verify upgrade using the installer built from this commit
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem candidate-installer -Filter '*Setup.exe' -File)
          if ($candidates.Count -ne 1) { throw 'Expected exactly one freshly built installer' }
          node scripts/verify-installer.cjs $candidates[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Candidate signature verification failed' }
          ./scripts/test-connected-upgrade.ps1 -Installer $candidates[0].FullName
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: connected-upgrade-evidence
          path: |
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.err
            ${{ runner.temp }}/atlas-ui-acceptance-*/**
          retention-days: 7
