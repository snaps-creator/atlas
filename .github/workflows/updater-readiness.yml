name: Isolated installed data diagnosis
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: remediation-candidate-421db099260cab7d5abede191db26469467ade6f
          path: candidate
          run-id: 38383899549
          github-token: ${{ github.token }}
      - name: Diagnose exact failed signed runtime
        shell: pwsh
        env:
          ATLAS_BUILD_ID: 421db099260cab7d5abede191db26469467ade6f
        run: |
          $installer=(Resolve-Path 'candidate/Atlas-Setup-2.5.1.exe').Path
          node scripts/verify-installer.cjs $installer
          if($LASTEXITCODE -ne 0){throw 'Signed runtime did not verify'}
          ./scripts/with-installed-desktop.ps1 -Script scripts/test-connected-upgrade.ps1 -Parameters @{Installer=$installer}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-diagnosis-${{ matrix.attempt }}
          path: |
            ${{ runner.temp }}/atlas-installed-desktop-*/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.err
