name: Verify updater release readiness

on:
  workflow_call:

permissions:
  contents: read

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - name: Check publication prerequisites before building
        run: node scripts/check-updater-readiness.cjs
