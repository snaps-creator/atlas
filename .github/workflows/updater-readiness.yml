name: Isolated installed desktop remediation proof
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/download-artifact@v4
        with:
          name: remediation-candidate-b766b255376a64a440a6e83f59d152944cba7d9e
          path: candidate
          run-id: 38268646107
          github-token: ${{ github.token }}
      - name: Verify previously built signed runtime and run complete installed acceptance in a normal desktop
        shell: pwsh
        env:
          ATLAS_BUILD_ID: b766b255376a64a440a6e83f59d152944cba7d9e
        run: |
          $installer=(Resolve-Path 'candidate/Atlas-Setup-2.5.1.exe').Path
          node scripts/verify-installer.cjs $installer
          if($LASTEXITCODE -ne 0){throw 'Existing signed runtime did not verify'}
          ./scripts/with-installed-desktop.ps1 -Script scripts/test-connected-upgrade.ps1 -Parameters @{Installer=$installer}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-desktop-proof
          path: |
            ${{ runner.temp }}/atlas-installed-desktop-*/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.err
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.error.txt
            ${{ runner.temp }}/atlas-ui-acceptance-*/**
          if-no-files-found: error