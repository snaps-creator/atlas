name: Build signed PR installer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/pr-installer.yml'

permissions:
  contents: read

jobs:
  installer:
    # Never expose signing material to a fork or pull_request_target context.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      ATLAS_BUILD_ID: ${{ github.event.pull_request.head.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
    # The signed installer can take over 20 minutes on a cold Windows runner.
    # Keep enough headroom for Rust/Tauri compilation and artifact upload.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../t
      - run: npm ci
      - run: npm test
      - run: node --test scripts/verify-installer.check.cjs
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is not configured.' }
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          ./scripts/copy-installer.ps1
          node scripts/verify-installer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification failed.' }
      - name: Package real installer and signature
        shell: pwsh
        run: ./scripts/package-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Atlas-Windows-x64-PR-${{ github.event.pull_request.number }}
          path: |
            Atlas*Setup.exe
            Atlas*Setup.exe.sig
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
