name: Build signed PR installer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    # Never expose signing material to a fork or pull_request_target context.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      ATLAS_BUILD_ID: ${{ github.event.pull_request.head.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/t
    # The signed installer can take over 20 minutes on a cold Windows runner.
    # Keep enough headroom for Rust/Tauri compilation and artifact upload.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize MSVC and CMake
        shell: pwsh
        run: ./scripts/initialize-msvc.ps1

      - name: Verify repeatable MSVC initialization
        shell: pwsh
        run: ./scripts/test-msvc-initialization.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: node --test scripts/verify-installer.check.cjs
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is not configured.' }
          ./scripts/build-release-installer.ps1 -Clean -Signed -TargetDirectory t/release-clean -OutputDirectory artifacts/release
      - name: Verify packaged interface and process cleanup
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/test-packaged-installer.ps1 -Installer "artifacts/release/Atlas-Setup-${version}.exe"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: packaged-ui-evidence
          path: ${{ runner.temp }}/atlas-ui-acceptance-*/**
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: Atlas-Windows-x64-PR-${{ github.event.pull_request.number }}
          path: |
            artifacts/release/Atlas-Setup-*.exe
            artifacts/release/Atlas-Setup-*.exe.sig
            artifacts/release/SHA256SUMS.txt
            artifacts/release/update-manifest.json*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
