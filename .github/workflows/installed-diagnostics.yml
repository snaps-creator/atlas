name: Installed candidate diagnostics
on:
  push:
    branches: [codex/installed-candidate-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  installed-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: remediation-candidate-ff10f54b4306e323da63fbd144163536933b78de
          run-id: 37875396482
          github-token: ${{ github.token }}
          path: candidate
      - name: Diagnose existing signed candidate; not a final-SHA gate
        shell: pwsh
        run: |
          $candidate='candidate/Atlas_2.4.3_x64-setup.exe'
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash -ne '66f3168a2a51184665a2cb004af719954023555581b77abc3d479f67c267d72b') { throw 'Diagnostic candidate identity mismatch' }
          node scripts/verify-installer.cjs $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
          ./scripts/test-connected-upgrade.ps1 -Installer $candidate
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: installed-diagnostic-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.log
            ${{ runner.temp }}/atlas-connected-upgrade-*/**/*.err
            ${{ runner.temp }}/atlas-ui-acceptance-*/**

